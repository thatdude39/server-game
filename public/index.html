<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a1a; color: #e0e0e0; font-family: monospace; display: flex; flex-direction: column; height: 100vh; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .msg.user { background: #2e4057; align-self: flex-end; }
    .msg.system { background: #2a2a2a; color: #888; align-self: flex-start; font-size: 12px; }
    .msg .meta { font-size: 11px; color: #666; margin-bottom: 4px; }
    #input-area { padding: 12px 16px; background: #111; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 8px; }
    #filename { background: #222; border: 1px solid #444; color: #e0e0e0; padding: 8px 10px; border-radius: 8px; font-family: monospace; font-size: 13px; width: 100%; }
    #content { background: #222; border: 1px solid #444; color: #e0e0e0; padding: 8px 10px; border-radius: 8px; font-family: monospace; font-size: 13px; width: 100%; resize: vertical; min-height: 80px; }
    #send { background: #2e4057; color: #e0e0e0; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: monospace; font-size: 13px; align-self: flex-end; }
    #send:hover { background: #3a5070; }
  </style>
</head>
<body>
  <div id="chat"></div>
  <div id="input-area">
    <input id="filename" placeholder="filename (e.g. src/main.js)" />
    <textarea id="content" placeholder="file content..."></textarea>
    <button id="send" onclick="send()">send</button>
  </div>

  <script>
    async function loadMessages() {
      const res = await fetch('/api/messages');
      const messages = await res.json();
      const chat = document.getElementById('chat');
      chat.innerHTML = '';
      for (const m of messages) {
        const div = document.createElement('div');
        div.className = `msg ${m.role}`;
        if (m.role === 'user') {
          div.innerHTML = `<div class="meta">${m.filename}</div>${escHtml(m.content)}`;
        } else {
          div.textContent = m.text;
        }
        chat.appendChild(div);
      }
      chat.scrollTop = chat.scrollHeight;
    }

    function humanDelay(content) {
      const minDelay = 10000;
      const maxDelay = 30000;
      const lengthRatio = Math.min(content.length / 500, 1);
      return Math.floor(minDelay + (maxDelay - minDelay) * lengthRatio * (0.5 + Math.random() * 0.5));
    }

    async function send() {
      const filename = document.getElementById('filename').value.trim();
      const content = document.getElementById('content').value;
      if (!filename || !content) return;

      const btn = document.getElementById('send');
      btn.disabled = true;

      const delay = humanDelay(content);
      let remaining = Math.ceil(delay / 1000);
      btn.textContent = `sending in ${remaining}s...`;
      const ticker = setInterval(() => {
        remaining--;
        if (remaining > 0) {
          btn.textContent = `sending in ${remaining}s...`;
        }
      }, 1000);

      await new Promise(r => setTimeout(r, delay));
      clearInterval(ticker);
      btn.textContent = 'sending...';

      const res = await fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename, content }),
      });

      const data = await res.json();
      btn.textContent = 'send';
      btn.disabled = false;

      if (data.success) {
        document.getElementById('content').value = '';
        loadMessages();
      } else {
        alert('error: ' + data.error);
      }
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    document.getElementById('content').addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.ctrlKey) send();
    });

    loadMessages();
    setInterval(loadMessages, 5000);
  </script>
</body>
</html>
